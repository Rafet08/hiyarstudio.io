<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title> Аяу ❄️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d1b2a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: #fff;
        }

        /* Контейнер приложения (имитация экрана телефона) */
        .phone-app {
            width: 100vw;
            height: 100vh;
            max-width: 480px;
            max-height: 900px;
            background: radial-gradient(circle, #1b263b 0%, #0f172a 100%);
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 20px;
            border: 4px solid #334155;
        }

        /* Заголовок */
        header {
            text-align: center;
            z-index: 10;
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(147, 197, 253, 0.5);
            letter-spacing: 1px;
        }

        header p {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 5px;
        }

        /* --- МОРОЗИЛЬНИК --- */
        .freezer-container {
            position: relative;
            width: 280px;
            height: 380px;
            perspective: 1000px; /* Для 3D эффекта */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Корпус морозильника */
        .freezer-body {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
            border-radius: 20px;
            box-shadow: 
                inset 0 0 20px rgba(0,0,0,0.2),
                0 15px 35px rgba(0,0,0,0.4);
            border: 3px solid #94a3b8;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: box-shadow 0.5s ease;
        }

        /* Внутреннее пространство (камера) */
        .freezer-inner {
            width: 90%;
            height: 90%;
            background: #0f172a;
            border-radius: 12px;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9);
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Подсветка (Неоновое свечение внутри) */
        .freezer-light {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(244, 63, 94, 0.6) 0%, rgba(244, 63, 94, 0) 70%);
            opacity: 0;
            transition: opacity 0.6s ease;
            pointer-events: none;
            z-index: 1;
        }

        /* Холодный пар (эффект дыма) */
        .steam-container {
            position: absolute;
            top: 10%;
            width: 100%;
            height: 80%;
            pointer-events: none;
            z-index: 3;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .steam-particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            filter: blur(8px);
            animation: float-steam 3s infinite linear;
        }

        /* Крышка морозильника (дверца) */
        .freezer-lid {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #f1f5f9 0%, #cbd5e1 100%);
            border-radius: 20px;
            border: 3px solid #94a3b8;
            z-index: 5;
            transform-origin: left center; /* Открывается как классическая дверь */
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.1), inset 5px 5px 15px rgba(255,255,255,0.8);
        }

        /* Ручка двери */
        .handle {
            width: 25px;
            height: 120px;
            background: linear-gradient(90deg, #94a3b8, #64748b, #94a3b8);
            border-radius: 10px;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.2);
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
        }

        /* Снежинка-логотип на крышке */
        .logo-snowflake {
            font-size: 3rem;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
            margin-top: 40px;
        }

        /* Состояние: Открыто */
        .freezer-container.open .freezer-lid {
            transform: rotateY(-115deg); /* Распахиваем дверцу */
            box-shadow: 15px 15px 30px rgba(0,0,0,0.5);
        }

        .freezer-container.open .freezer-light {
            opacity: 1;
        }

        .freezer-container.open .steam-container {
            opacity: 1;
        }

        /* --- СЕРДЕЧКИ (ВЫЕЗЖАЮТ) --- */
        .hearts-holder {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            pointer-events: none;
        }

        .heart-card {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(244, 63, 94, 0.5);
            border-radius: 50%;
            transform: scale(0) rotate(0deg);
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            user-select: none;
        }

        /* Стилизация каждого вылетающего сердечка */
        .heart-1 {
            width: 75px;
            height: 75px;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            font-size: 2.5rem;
        }

        .heart-2 {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            font-size: 2rem;
        }

        .heart-3 {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #f857a6 0%, #ff5858 100%);
            font-size: 2.2rem;
        }

        .heart-4 {
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #ec4899 0%, #f43f5e 100%);
            font-size: 1.8rem;
        }

        /* Главное сердечко АЯУ */
        .heart-ayau {
            width: 110px;
            height: 110px;
            background: radial-gradient(circle, #ff007f 0%, #e11d48 100%);
            font-size: 1.1rem;
            color: #fff;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 3px solid #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            box-shadow: 0 0 25px rgba(244, 63, 94, 0.8);
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        /* Анимация вылета карт при открытии */
        .freezer-container.open .heart-1 {
            transform: scale(1) translate(-65px, -55px) rotate(-15deg);
            z-index: 2;
            transition-delay: 0.2s;
        }

        .freezer-container.open .heart-2 {
            transform: scale(1) translate(70px, -45px) rotate(15deg);
            z-index: 3;
            transition-delay: 0.3s;
        }

        .freezer-container.open .heart-3 {
            transform: scale(1) translate(-60px, 50px) rotate(-10deg);
            z-index: 4;
            transition-delay: 0.4s;
        }

        .freezer-container.open .heart-4 {
            transform: scale(1) translate(65px, 60px) rotate(20deg);
            z-index: 2;
            transition-delay: 0.5s;
        }

        /* Главное сердце по центру с анимацией пульсации */
        .freezer-container.open .heart-ayau {
            transform: scale(1.1) translate(0px, -10px) rotate(0deg);
            z-index: 5;
            transition-delay: 0.1s;
            animation: pulse-heart 1.2s infinite alternate ease-in-out 0.9s;
        }

        /* Анимация биения сердца */
        @keyframes pulse-heart {
            0% {
                transform: scale(1.1) translate(0px, -10px) rotate(0deg);
                box-shadow: 0 0 20px rgba(244, 63, 94, 0.7);
            }
            100% {
                transform: scale(1.25) translate(0px, -10px) rotate(3deg);
                box-shadow: 0 0 35px rgba(244, 63, 94, 1);
            }
        }

        /* Инструкция снизу */
        .footer-instruction {
            text-align: center;
            font-size: 0.9rem;
            color: #64748b;
            background: rgba(30, 41, 59, 0.5);
            padding: 10px 20px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Анимация пара */
        @keyframes float-steam {
            0% {
                transform: translateY(100%) translateX(0) scale(0.6);
                opacity: 0;
            }
            30% {
                opacity: 0.6;
            }
            80% {
                opacity: 0.2;
            }
            100% {
                transform: translateY(-20%) translateX(20px) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="phone-app">
        <header>
            <h1>Морозильник  ❄️</h1>
            <p>Коснись, чтобы открыть тепло внутри</p>
        </header>

        <div class="freezer-container" id="freezer" onclick="toggleFreezer()">
            
            <div class="freezer-body">
                <div class="freezer-inner">
                    <div class="freezer-light"></div>
                    
                    <div class="steam-container" id="steam"></div>

                    <div class="hearts-holder" id="hearts-holder">
                        <div class="heart-card heart-1">💖</div>
                        <div class="heart-card heart-2">💝</div>
                        <div class="heart-card heart-3">💕</div>
                        <div class="heart-card heart-4">💘</div>
                        
                        <div class="heart-card heart-ayau">
                            <span>Аяу</span>
                            <span style="font-size: 1.6rem;">❤️</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="freezer-lid">
                <div class="logo-snowflake">❄</div>
                <div class="handle"></div>
                <div style="font-size: 0.75rem; color: #64748b; font-weight: bold; text-transform: uppercase; letter-spacing: 2px;">frost-free</div>
            </div>

        </div>

        <div class="footer-instruction" id="status-text">
            Нажми на морозильник
        </div>
    </div>

    <script>
        let isOpen = false;
        const freezer = document.getElementById('freezer');
        const statusText = document.getElementById('status-text');
        const heartsHolder = document.getElementById('hearts-holder');

        // Создаем генератор холодного пара
        const steamContainer = document.getElementById('steam');
        for (let i = 0; i < 15; i++) {
            let particle = document.createElement('div');
            particle.classList.add('steam-particle');
            
            let size = Math.random() * 40 + 20;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = Math.random() * 80 + 10 + '%';
            particle.style.animationDelay = Math.random() * 2 + 's';
            particle.style.animationDuration = Math.random() * 2 + 2 + 's';
            
            steamContainer.appendChild(particle);
        }

        // Функция взрыва множества маленьких сердечек
        function burstHearts() {
            const emojis = ['❤️', '💖', '💝', '💕', '💘', '🌸', '✨'];
            for (let i = 0; i < 30; i++) {
                const heart = document.createElement('div');
                heart.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                heart.style.position = 'absolute';
                heart.style.fontSize = Math.random() * 24 + 16 + 'px';
                heart.style.left = '50%';
                heart.style.top = '50%';
                heart.style.transform = 'translate(-50%, -50%) scale(0)';
                heart.style.pointerEvents = 'none';
                heart.style.zIndex = '10';
                heart.style.transition = 'all 1.2s cubic-bezier(0.1, 0.8, 0.3, 1)';
                
                heartsHolder.appendChild(heart);

                // Случайный угол и расстояние для разлета
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 160 + 90;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;

                // Запуск полета сердечка
                setTimeout(() => {
                    heart.style.transform = `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(1.3) rotate(${Math.random() * 60 - 30}deg)`;
                    heart.style.opacity = '0';
                }, 50);

                // Удаление после окончания анимации
                setTimeout(() => {
                    heart.remove();
                }, 1250);
            }
        }

        // Синтезатор звука (Web Audio API)
        function playSound(open) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                if (open) {
                    let osc1 = audioCtx.createOscillator();
                    let osc2 = audioCtx.createOscillator();
                    let gainNode = audioCtx.createGain();

                    osc1.type = 'sine';
                    osc1.frequency.setValueAtTime(150, audioCtx.currentTime);
                    osc1.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.6);

                    osc2.type = 'triangle';
                    osc2.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc2.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.8);

                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);

                    osc1.connect(gainNode);
                    osc2.connect(gainNode);
                    gainNode.connect(audioCtx.destination);

                    osc1.start();
                    osc2.start();
                    osc1.stop(audioCtx.currentTime + 0.8);
                    osc2.stop(audioCtx.currentTime + 0.8);
                } else {
                    let osc = audioCtx.createOscillator();
                    let gainNode = audioCtx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);

                    gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);

                    osc.connect(gainNode);
                    gainNode.connect(audioCtx.destination);

                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                }
            } catch (e) {
                console.log("Audio API не поддерживается до первого взаимодействия");
            }
        }

        // Вибрация телефона
        function triggerVibration() {
            if (navigator.vibrate) {
                navigator.vibrate(100);
            }
        }

        function toggleFreezer() {
            isOpen = !isOpen;

            if (isOpen) {
                freezer.classList.add('open');
                statusText.innerText = " Аяу! ❤️✨";
                statusText.style.color = "#f43f5e";
                playSound(true);
                triggerVibration();
                burstHearts(); // Взрыв маленьких сердечек при открытии!
            } else {
                freezer.classList.remove('open');
                statusText.innerText = "Нажми на морозильник";
                statusText.style.color = "#64748b";
                playSound(false);
                triggerVibration();
            }
        }
    </script>
</body>
</html>
