<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Морозильник Аяу ❄️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d1b2a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: #fff;
        }

        /* Контейнер приложения (имитация экрана телефона) */
        .phone-app {
            width: 100vw;
            height: 100vh;
            max-width: 480px;
            max-height: 900px;
            background: radial-gradient(circle, #1b263b 0%, #0f172a 100%);
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 20px;
            border: 4px solid #334155;
        }

        /* Заголовок */
        header {
            text-align: center;
            z-index: 10;
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(147, 197, 253, 0.5);
            letter-spacing: 1px;
        }

        header p {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 5px;
        }

        /* --- МОРОЗИЛЬНИК --- */
        .freezer-container {
            position: relative;
            width: 280px;
            height: 380px;
            perspective: 1000px; /* Для 3D эффекта */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Корпус морозильника */
        .freezer-body {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
            border-radius: 20px;
            box-shadow: 
                inset 0 0 20px rgba(0,0,0,0.2),
                0 15px 35px rgba(0,0,0,0.4);
            border: 3px solid #94a3b8;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: box-shadow 0.5s ease;
        }

        /* Внутреннее пространство (камера) */
        .freezer-inner {
            width: 90%;
            height: 90%;
            background: #0f172a;
            border-radius: 12px;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9);
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Подсветка (Неоновое свечение внутри) */
        .freezer-light {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.6) 0%, rgba(56, 189, 248, 0) 70%);
            opacity: 0;
            transition: opacity 0.6s ease;
            pointer-events: none;
            z-index: 1;
        }

        /* Холодный пар (эффект дыма) */
        .steam-container {
            position: absolute;
            top: 10%;
            width: 100%;
            height: 80%;
            pointer-events: none;
            z-index: 3;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .steam-particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            filter: blur(8px);
            animation: float-steam 3s infinite linear;
        }

        /* Крышка морозильника (дверца) */
        .freezer-lid {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #f1f5f9 0%, #cbd5e1 100%);
            border-radius: 20px;
            border: 3px solid #94a3b8;
            z-index: 5;
            transform-origin: left center; /* Открывается как классическая дверь */
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.1), inset 5px 5px 15px rgba(255,255,255,0.8);
        }

        /* Ручка двери */
        .handle {
            width: 25px;
            height: 120px;
            background: linear-gradient(90deg, #94a3b8, #64748b, #94a3b8);
            border-radius: 10px;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.2);
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
        }

        /* Снежинка-логотип на крышке */
        .logo-snowflake {
            font-size: 3rem;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
            margin-top: 40px;
        }

        /* Состояние: Открыто */
        .freezer-container.open .freezer-lid {
            transform: rotateY(-115deg); /* Распахиваем дверцу */
            box-shadow: 15px 15px 30px rgba(0,0,0,0.5);
        }

        .freezer-container.open .freezer-light {
            opacity: 1;
        }

        .freezer-container.open .steam-container {
            opacity: 1;
        }

        /* --- ФОТОКАРТОЧКИ (ВЫЕЗЖАЮТ) --- */
        .photos-holder {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        .photo-card {
            position: absolute;
            width: 150px;
            height: 190px;
            background: white;
            padding: 8px 8px 25px 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 4px;
            transform: scale(0) rotate(0deg);
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 2px;
            background-color: #ddd; /* Заглушка пока грузится */
        }

        /* Анимация вылета карт при открытии */
        .freezer-container.open .photo-1 {
            transform: scale(1) translate(-35px, -30px) rotate(-10deg);
            z-index: 2;
            transition-delay: 0.3s;
        }

        .freezer-container.open .photo-2 {
            transform: scale(1.05) translate(30px, 20px) rotate(8deg);
            z-index: 3;
            transition-delay: 0.5s;
        }

        .freezer-container.open .photo-3 {
            transform: scale(0.95) translate(-10px, 70px) rotate(-3deg);
            z-index: 4;
            transition-delay: 0.7s;
        }

        /* Инструкция снизу */
        .footer-instruction {
            text-align: center;
            font-size: 0.9rem;
            color: #64748b;
            background: rgba(30, 41, 59, 0.5);
            padding: 10px 20px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Анимация пара */
        @keyframes float-steam {
            0% {
                transform: translateY(100%) translateX(0) scale(0.6);
                opacity: 0;
            }
            30% {
                opacity: 0.6;
            }
            80% {
                opacity: 0.2;
            }
            100% {
                transform: translateY(-20%) translateX(20px) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="phone-app">
        <header>
            <h1>Морозильник Аяу ❄️</h1>
            <p>Коснись, чтобы открыть холод</p>
        </header>

        <div class="freezer-container" id="freezer" onclick="toggleFreezer()">
            
            <div class="freezer-body">
                <div class="freezer-inner">
                    <div class="freezer-light"></div>
                    
                    <div class="steam-container" id="steam">
                        </div>

                    <div class="photos-holder">
                        <div class="photo-card photo-1">
                            <img src="image/ayau.jpeg" alt="Фото 1">
                        </div>
                        <div class="photo-card photo-2">
                            <img src="image/ayau1.jpeg" alt="Фото 2">
                        </div>
                        <div class="photo-card photo-3">
                            <img src="image/ayau2.jpeg" alt="Фото 3">
                        </div>
                    </div>
                </div>
            </div>

            <div class="freezer-lid">
                <div class="logo-snowflake">❄</div>
                <div class="handle"></div>
                <div style="font-size: 0.75rem; color: #64748b; font-weight: bold; text-transform: uppercase; letter-spacing: 2px;">frost-free</div>
            </div>

        </div>

        <div class="footer-instruction" id="status-text">
            Нажми на морозильник
        </div>
    </div>

    <script>
        let isOpen = false;
        const freezer = document.getElementById('freezer');
        const statusText = document.getElementById('status-text');

        // Создаем генератор холодного пара
        const steamContainer = document.getElementById('steam');
        for (let i = 0; i < 15; i++) {
            let particle = document.createElement('div');
            particle.classList.add('steam-particle');
            
            // Рандомизируем размеры и анимацию пара
            let size = Math.random() * 40 + 20;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = Math.random() * 80 + 10 + '%';
            particle.style.animationDelay = Math.random() * 2 + 's';
            particle.style.animationDuration = Math.random() * 2 + 2 + 's';
            
            steamContainer.appendChild(particle);
        }

        // Синтезатор звука (Web Audio API)
        function playSound(open) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                if (open) {
                    // Звук открытия: Низкий басовый "вдох" воздуха + свист холода
                    let osc1 = audioCtx.createOscillator();
                    let osc2 = audioCtx.createOscillator();
                    let gainNode = audioCtx.createGain();

                    osc1.type = 'sine';
                    osc1.frequency.setValueAtTime(150, audioCtx.currentTime);
                    osc1.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.6);

                    osc2.type = 'triangle';
                    osc2.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc2.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.8);

                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);

                    osc1.connect(gainNode);
                    osc2.connect(gainNode);
                    gainNode.connect(audioCtx.destination);

                    osc1.start();
                    osc2.start();
                    osc1.stop(audioCtx.currentTime + 0.8);
                    osc2.stop(audioCtx.currentTime + 0.8);
                } else {
                    // Звук закрытия: Плотный глухой хлопок
                    let osc = audioCtx.createOscillator();
                    let gainNode = audioCtx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);

                    gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);

                    osc.connect(gainNode);
                    gainNode.connect(audioCtx.destination);

                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                }
            } catch (e) {
                console.log("Audio API не поддерживается до первого взаимодействия с экраном");
            }
        }

        // Вибрация телефона
        function triggerVibration() {
            if (navigator.vibrate) {
                // Вибрируем 100 миллисекунд (мягкий отклик)
                navigator.vibrate(100);
            }
        }

        function toggleFreezer() {
            isOpen = !isOpen;

            if (isOpen) {
                freezer.classList.add('open');
                statusText.innerText = "Холод выпущен! ❄️✨";
                statusText.style.color = "#38bdf8";
                playSound(true);
                triggerVibration();
            } else {
                freezer.classList.remove('open');
                statusText.innerText = "Нажми на морозильник";
                statusText.style.color = "#64748b";
                playSound(false);
                triggerVibration();
            }
        }
    </script>
</body>
</html>
